# Copied verbatim from frontend/src/graphql/queries/prof/ProfReview.tsx (PROF_REVIEWS)
# and its fragments. Keep in step with the frontend.

query profReviews($id: Int) {
  review(
    where: { prof_id: { _eq: $id }, prof_comment: { _is_null: false } }
  ) {
    ...ReviewInfo
    ...ReviewVoteCounts
  }
}

# frontend/src/graphql/fragments/ReviewFragment.tsx (reviewInfo)
fragment ReviewInfo on review {
  id
  created_at
  updated_at
  public
  liked
  course_comment
  course_easy
  course_useful
  prof_engaging
  prof_comment
  prof_clear
  author {
    full_name
    picture_url
    program
  }
  course_id
  course {
    id
    code
    name
    profs_teaching {
      prof {
        id
        name
      }
    }
    rating {
      liked
    }
  }
  prof_id
  prof {
    id
    name
    code
    picture_url
    rating {
      liked
    }
  }
}

# frontend/src/graphql/fragments/ReviewFragment.tsx (reviewVoteCounts)
fragment ReviewVoteCounts on review {
  id
  course_review_rating {
    upvote_count
  }
  prof_review_rating {
    upvote_count
  }
}
