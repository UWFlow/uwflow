# Copied verbatim from frontend/src/graphql/queries/explore/Explore.tsx (EXPLORE_ALL_QUERY)
# and its fragments. Keep in step with the frontend.

query exploreAll {
  course_search_index {
    ...CourseSearch
  }
  prof_search_index {
    ...ProfSearch
  }
}

# frontend/src/graphql/fragments/SearchFragment.tsx (courseSearch)
fragment CourseSearch on course_search_index {
  course_id
  name
  code
  aliases
  useful
  terms
  terms_with_seats
  terms_with_online_sections
  ratings
  prof_ids
  liked
  easy
  has_prereqs
}

# frontend/src/graphql/fragments/SearchFragment.tsx (profSearch)
fragment ProfSearch on prof_search_index {
  prof_id
  name
  code
  clear
  course_ids
  course_codes
  alias_links {
    name
    code
  }
  engaging
  liked
  ratings
}
