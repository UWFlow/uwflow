# Slack app manifest for the UWFlow data bot. Create the app from this at
# https://api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: UWFlow Data
  description: Answers questions about UWFlow's data using Claude.
  background_color: "#1a1a1a"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: uwflow-data
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
