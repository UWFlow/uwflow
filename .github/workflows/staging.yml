# Deploy a PR (or main) to the staging box and smoke-test it.
#
# Add the `staging` label to a PR to deploy it; later pushes redeploy it.
# Staging is one slot, so deploying a PR takes the label off the previous one.
# "Run workflow" deploys main or a PR by number, and can refresh prod data.
#
# Setup: docs/staging.md.
name: Staging

run-name: >-
  Staging · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number)
  || (inputs.pr && format('PR #{0}', inputs.pr)) || 'main' }}

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to deploy (leave empty to deploy main)
        required: false
        type: string
      refresh_data:
        description: Replace staging data with today's production dump (make setup)
        type: boolean
        default: false

# One box, one database: queue deploys rather than overlapping them.
concurrency:
  group: staging
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # Skip other labels, unlabelled PRs, and forks (no secrets for them).
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'staging') &&
        (github.event.action != 'labeled' || github.event.label.name == 'staging'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      id-token: write       # AWS role that opens SSH to this runner
      pull-requests: write  # move the staging label
    env:
      SG: ${{ vars.STAGING_SECURITY_GROUP_ID }}
    steps:
      - name: Resolve commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          if [ -n "$EVENT_PR" ]; then
            pr="$EVENT_PR" sha="$EVENT_SHA"
          elif [ -n "$INPUT_PR" ]; then
            [[ "$INPUT_PR" =~ ^[0-9]+$ ]] || { echo "::error::PR must be a number"; exit 1; }
            read -r head_repo sha < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR" \
              --jq '[.head.repo.full_name, .head.sha] | @tsv')
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::PR #$INPUT_PR is from a fork"; exit 1; }
            pr="$INPUT_PR"
          else
            pr="" sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          fi
          printf 'PR=%s\nSHA=%s\n' "$pr" "$sha" | tee -a "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # Same script and tags as production builds: neuwflow/<service>:<sha>.
      # uw and email never run on staging, so they are not built.
      - name: Build images
        run: IMAGE_TAG="$SHA" ./script/build.sh api frontend

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_AWS_ROLE_ARN }}
          aws-region: us-east-2

      # The box's security group only admits its owner's IP; let this runner
      # in until the job ends.
      - name: Open SSH to this runner
        run: |
          cidr="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')/32"
          echo "RUNNER_CIDR=$cidr" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr "$cidr" >/dev/null

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.STAGING_SSH_HOST }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging && chmod 0600 ~/.ssh/staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host staging\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/staging\n  BatchMode yes\n  ServerAliveInterval 30\n' \
            "$HOST" > ~/.ssh/config
          # Security group changes take a few seconds to apply.
          for _ in 1 2 3 4 5 6; do ssh -o ConnectTimeout=10 staging true && exit 0; sleep 5; done
          exit 1

      - name: Copy images to the box
        run: docker save "neuwflow/api:$SHA" "neuwflow/frontend:$SHA" | gzip -1 | ssh staging 'gunzip | docker load'

      - name: Deploy
        env:
          REFRESH: ${{ inputs.refresh_data && 'yes' || '' }}
        run: |
          # $SHA and $REFRESH expand on the runner, on purpose.
          # shellcheck disable=SC2087
          ssh staging bash -s <<EOF
          set -euo pipefail
          cd ~/uwflow
          # Migrations, Hasura metadata and nginx config must match the images.
          git fetch --quiet origin "$SHA"
          git checkout --quiet --detach "$SHA"
          # First deploy, or when asked: restore today's production dump.
          if [ -n "$REFRESH" ] || ! docker volume inspect backend_postgres >/dev/null 2>&1; then
            rm -f ./*-pg-latest.dump
            script/fetch-dump.sh uwflow-prod
            make setup
          fi
          UWFLOW_IMAGE_TAG="$SHA" docker compose up -d postgres hasura api frontend
          EOF

      - name: Smoke test
        run: |
          # shellcheck disable=SC2087
          ssh staging bash -s <<EOF
          set -euo pipefail
          cd ~/uwflow
          . ./.env
          site() { curl -fsSk --retry 20 --retry-delay 3 --retry-all-errors -H "Host: \$DOMAIN" "\$@"; }
          for service in api frontend; do
            image="\$(docker inspect -f '{{.Config.Image}}' "\$service")"
            [ "\$image" = "neuwflow/\$service:$SHA" ] || { echo "FAIL \$service runs \$image"; exit 1; }
          done
          echo "PASS api and frontend run ${SHA:0:12}"
          site https://127.0.0.1/ | grep -q 'id="root"'
          echo "PASS frontend serves index.html"
          site -H 'Content-Type: application/json' -d '{"query":"{ course(limit: 1) { code } }"}' \
            https://127.0.0.1/graphql | grep -q '"code"'
          echo "PASS anonymous GraphQL returns courses"
          site https://127.0.0.1/api/data/search | grep -q '"courses":\[{'
          echo "PASS API serves search data"
          curl -fsS -H "X-Hasura-Admin-Secret: \$HASURA_GRAPHQL_ADMIN_SECRET" \
            -d '{"type":"get_inconsistent_metadata","args":{}}' \
            "http://127.0.0.1:\$HASURA_PORT/v1/metadata" | grep -q '"is_consistent":true'
          echo "PASS Hasura metadata is consistent"
          # A crash-looping container restarts within this window.
          before="\$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' postgres hasura api frontend)"
          sleep 15
          after="\$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' postgres hasura api frontend)"
          [ "\$before" = "\$after" ] && ! grep -qv '^running ' <<<"\$after" \
            || { echo "FAIL containers are not stable:"; echo "\$after"; exit 1; }
          echo "PASS containers are running and stable"
          EOF

      - name: Logs
        if: failure()
        run: ssh staging 'cd ~/uwflow && docker compose logs --tail 100 postgres hasura api frontend' || true

      - name: Close SSH
        if: always()
        run: |
          if [ -n "${RUNNER_CIDR:-}" ]; then
            aws ec2 revoke-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr "$RUNNER_CIDR" >/dev/null
          fi

      - name: Move the staging label here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --label staging --json number --jq '.[].number' \
            | while read -r other; do
                [ "$other" = "$PR" ] || gh pr edit "$other" --repo "$GITHUB_REPOSITORY" --remove-label staging
              done
