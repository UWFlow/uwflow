# Install in the production host's sshd configuration include directory.
# Replace 5432 with POSTGRES_PORT if different. See README before installing.
Match User posthog_tunnel
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/posthog_tunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:5432
    PermitListen none
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 0
Match all
