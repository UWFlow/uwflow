table:
  name: user_schedule_swap
  schema: public
object_relationships:
  - name: replacement_section
    using:
      foreign_key_constraint_on: replacement_section_id
  - name: source_schedule
    using:
      foreign_key_constraint_on:
        - user_id
        - source_section_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - replacement_section_id
        - source_section_id
        - user_id
select_permissions:
  - role: user
    permission:
      columns:
        - replacement_section_id
        - source_section_id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - replacement_section_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
