table:
  name: shared_group
  schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: shared_group_member
          schema: public
computed_fields:
  # How many people have joined. A count rather than the rows themselves, so an
  # invite can say "4 members" without the invitee being able to read who they
  # are before accepting.
  - name: member_count
    definition:
      function:
        name: shared_group_member_count
        schema: public
insert_permissions:
  # Creating a group is a nested insert: the group, with the creator as its
  # first member (see shared_group_member). created_by is a preset, so it is
  # not in the input type at all; the check restates that independently, and is
  # what still holds if the preset is removed or the column made insertable.
  - role: user
    permission:
      check:
        created_by:
          _eq: X-Hasura-User-Id
      set:
        created_by: X-Hasura-User-Id
      columns:
        - name
select_permissions:
  # Every group you are in, invites included: a pending invite has to show the
  # group's name and size to be worth responding to.
  - role: user
    permission:
      columns:
        - id
        - name
        - created_by
        - created_at
      computed_fields:
        - member_count
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
delete_permissions:
  # Only the creator, and the members cascade with it.
  - role: user
    permission:
      filter:
        created_by:
          _eq: X-Hasura-User-Id
