table:
  name: prof_search_index
  schema: public
array_relationships:
  - name: alias_links
    using:
      manual_configuration:
        column_mapping:
          prof_id: merged_into
        insertion_order: null
        remote_table:
          name: prof
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - course_ids
        - course_codes
        - prof_id
        - ratings
        - clear
        - engaging
        - liked
        - name
        - code
        - aliases
      filter: {}
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - course_ids
        - course_codes
        - prof_id
        - ratings
        - clear
        - engaging
        - liked
        - name
        - code
        - aliases
      filter: {}
      allow_aggregations: true
