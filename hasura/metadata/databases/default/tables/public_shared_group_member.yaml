table:
  name: shared_group_member
  schema: public
object_relationships:
  - name: group
    using:
      foreign_key_constraint_on: group_id
insert_permissions:
  # Yourself only, as a confirmed member, and only into a group you created.
  # That is exactly the nested insert that creates a group, and nothing else:
  # it cannot add anyone to a group, and cannot join a group you did not make.
  # POST /group/{id}/invite emails a bearer secret; it never grants membership
  # based on an editable profile email.
  - role: user
    permission:
      check:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - status:
              _eq: member
          - group:
              created_by:
                _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - group_id
        - status
select_permissions:
  # Ids and status only; names are not reachable from here, and come from
  # GET /group/{id}, which requires confirmed membership. Visible for any group
  # you have a row in, invites included, so an invite can show its member count
  # before you accept.
  - role: user
    permission:
      columns:
        - group_id
        - user_id
        - status
        - created_at
      filter:
        group:
          members:
            user_id:
              _eq: X-Hasura-User-Id
      # A group's member count is an aggregate over rows already selectable
      # above, and is what the group list renders next to each group.
      allow_aggregations: true
update_permissions:
  # Retained for client schema compatibility. The verified_members_only database
  # constraint prevents pending rows; new invites use the emailed-secret API.
  - role: user
    permission:
      columns:
        - status
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - status:
              _eq: pending
      check:
        status:
          _eq: member
delete_permissions:
  # Declining an invite and leaving a group are the same row deletion.
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
